server
    {
        listen 80;
        #listen [::]:80;
        server_name www.arxhe.com arxhe.com;
        index index.html;
        root  /www/data/arxhe-associates;
        charset utf-8;

        # Next.js 静态导出：/about -> /about.html，目录与 404 兜底
        location / {
            try_files $uri $uri.html $uri/ /404.html;
        }

        # 老站 .html 链接兼容：直接命中同名文件（try_files 已覆盖），无需额外规则

        location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|svg|webp|mp4|ico)$
        {
            expires      30d;
        }

        location ~ .*\.(js|css)?$
        {
            expires      12h;
        }

        location ~ /.well-known {
            allow all;
        }

        location ~ /\.
        {
            deny all;
        }

        access_log  /home/wwwlogs/www.arxhe.com.log;
    }
